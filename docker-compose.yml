version: '3.8'

services:
  # MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: neuroforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: neuroforge
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-neuroforge_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-neuroforge_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: ./neuroforge-backend
      dockerfile: Dockerfile
    container_name: neuroforge-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/neuroforge?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-neuroforge_user}
      DB_PASSWORD: ${DB_PASSWORD:-neuroforge_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8080:8080"

  # React SPA Frontend (Nginx)
  frontend:
    build:
      context: ./neuroforge-frontend
      dockerfile: Dockerfile
    container_name: neuroforge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
